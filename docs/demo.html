<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo · Parafarmacia Stock</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: #0a0e0c;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      .frame {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 100% 0%, rgba(45, 106, 79, 0.35), transparent 55%),
          radial-gradient(circle at 0% 100%, rgba(82, 183, 136, 0.25), transparent 50%),
          #0a0e0c;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <video controls playsinline preload="metadata" poster="">
        <source src="demo-proyecto-2.mp4" type="video/mp4" />
      </video>
    </div>
  </body>
</html>
